name: AlfaGram iOS (imzosiz sinov build)

# Qo'lda ishga tushiriladi. Haqiqiy imzo (Apple Developer akkaunti) qo'shilmaguncha
# Telegram'ning "fake-codesigning" sertifikatlari bilan imzosiz IPA yig'iladi —
# maqsad: kod kompilyatsiya bo'lishini tekshirish.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Xcode versiyasini tanlash
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version

      - name: Doimiy manba papkasi
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export BUILD_NUMBER="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=debug_sim_arm64 \
            --disableProvisioningProfiles \
            --buildNumber="$BUILD_NUMBER"

          # Simulyator uchun build (Telegram'ning fake-codesigning profillari 2026-10-30 da eskirgan).
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          find bazel-out/ -path "*/bin/Telegram/Telegram.ipa" -maxdepth 5 | head -1 | while read f; do
            cp "$f" "$OUTPUT_PATH/AlfaGram-simulator.ipa"
          done
          ls -la "$OUTPUT_PATH"

      - name: Natijani saqlash
        uses: actions/upload-artifact@v4
        with:
          name: alfagram-ios-sim-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/
          if-no-files-found: warn
          retention-days: 14
